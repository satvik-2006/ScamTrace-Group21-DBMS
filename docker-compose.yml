services:
  mysql:
    image: mysql:8.4
    container_name: scamtrace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: scamtrace
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - scamtrace_mysql:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
  mongodb:
    image: mongo:7
    container_name: scamtrace-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - scamtrace_mongo:/data/db
volumes:
  scamtrace_mysql:
  scamtrace_mongo:
